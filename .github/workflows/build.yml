name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: unzip StaffCore.zip
      - run: mvn -B package
        working-directory: StaffCore
      - uses: actions/upload-artifact@v4
        with:
          name: StaffCore-jar
          path: StaffCore/target/StaffCore-1.0.0.jar
